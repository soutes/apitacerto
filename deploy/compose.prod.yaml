# Producao na Oracle (VM.Standard.E2.1.Micro: 1 GB de RAM + 2 GB de swap).
# Fica em /opt/apitacerto no servidor, ao lado de um .env (so no servidor,
# nunca no git) com POSTGRES_PASSWORD e APITACERTO_IMAGE.
#
#   docker compose -f compose.prod.yaml up -d
#
# Diferencas do compose.yaml local: Postgres configurado pequeno, Caddy na
# frente (portas 80/443, HTTPS automatico), nenhuma porta do banco ou da API
# exposta, limites de memoria.

x-db-url: &db-url postgresql+psycopg://apitacerto:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/apitacerto

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: apitacerto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: apitacerto
    # pouca memoria: o banco inteiro tem poucos MB
    command: ["postgres", "-c", "shared_buffers=48MB", "-c", "max_connections=20", "-c", "work_mem=4MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apitacerto -d apitacerto"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

  seed:
    image: ${APITACERTO_IMAGE:-apitacerto:local}
    command: ["python", "scripts/seed.py", "load"]
    environment:
      DATABASE_URL: *db-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: ${APITACERTO_IMAGE:-apitacerto:local}
    environment:
      DATABASE_URL: *db-url
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    mem_limit: 64m
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
