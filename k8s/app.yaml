# API + front: 2 copias (Deployment) atras de um nome estavel (Service).
# So recebe acesso a copia cujo /health responde 200 (readinessProbe).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apitacerto
spec:
  replicas: 2
  selector:
    matchLabels: { app: apitacerto }
  template:
    metadata:
      labels: { app: apitacerto }
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:17
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 2; done"]
      containers:
        - name: app
          image: apitacerto:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: apitacerto-db }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: apitacerto
spec:
  selector: { app: apitacerto }
  ports:
    - port: 8000
      targetPort: 8000
