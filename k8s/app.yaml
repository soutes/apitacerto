# API + front: 2 copias (Deployment) atras de um nome estavel (Service).
# So recebe acesso a copia cujo /health responde 200 (readinessProbe).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apitacerto
spec:
  replicas: 2
  selector:
    matchLabels: { app: apitacerto }
  template:
    metadata:
      labels: { app: apitacerto }
    spec:
      initContainers:
        # espera a CARGA terminar, nao so o Postgres aceitar conexao: com o
        # banco vazio a API cai no mock e serviria dado de exemplo como real
        - name: wait-for-seed
          image: postgres:17
          command:
            - sh
            - -c
            - until psql -tAc 'SELECT 1 FROM fixtures LIMIT 1' 2>/dev/null | grep -q 1; do echo aguardando carga; sleep 2; done
          env:
            - { name: PGHOST, value: postgres }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: apitacerto-db, key: POSTGRES_USER } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: apitacerto-db, key: POSTGRES_PASSWORD } }
            - name: PGDATABASE
              valueFrom: { secretKeyRef: { name: apitacerto-db, key: POSTGRES_DB } }
      containers:
        - name: app
          image: apitacerto:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: apitacerto-db }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: apitacerto
spec:
  selector: { app: apitacerto }
  ports:
    - port: 8000
      targetPort: 8000
