# Carga inicial (mesmo seed do Compose). Roda uma vez e termina; em banco
# que ja tem jogos nao faz nada, entao pode ser reaplicado sem medo.
apiVersion: batch/v1
kind: Job
metadata:
  name: apitacerto-seed
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:17
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 2; done"]
      containers:
        - name: seed
          image: apitacerto:local
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/seed.py", "load"]
          envFrom:
            - secretRef: { name: apitacerto-db }
